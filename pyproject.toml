[project]
name = "agent-m2m"
version = "0.1.0"
description = "AI 구매 에이전트가 벤치마크 표로 모델을 고르고 AEGIS 토큰으로 결제하는 데모 (Python 서버)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pymongo>=4.10",
  "web3>=7.6",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
